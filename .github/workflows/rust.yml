name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ published ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
    #          - beta
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
          cache: true
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
      - if: matrix.rust == 'stable'
        run: cargo clippy
        env:
          RUSTFLAGS: -W warnings

  release:
    name: Release (${{ matrix.target }})
    if: github.event_name == 'release'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate release tag (vMAJOR.MINOR.PATCH)
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag '$TAG' does not follow the vMAJOR.MINOR.PATCH format."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: true
          cache-key: ${{ matrix.target }}
          rustflags: ""

      - name: Build release binaries
        run: cargo build --workspace --release --target ${{ matrix.target }} --verbose

      - name: Package binaries
        id: package
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          name="rad-tools-${TAG}-${{ matrix.target }}"
          staging="dist/${name}"
          mkdir -p "${staging}"

          # Collect every binary target built by default (skip those gated behind
          # required-features, e.g. experimental ones). Strip CR from jq output on Windows.
          bins=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[].targets[]
                     | select((.kind | index("bin")) and ((.["required-features"] // []) | length == 0))
                     | .name' \
            | tr -d '\r')
          ext=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then ext=".exe"; fi
          for bin in ${bins}; do
            cp "target/${{ matrix.target }}/release/${bin}${ext}" "${staging}/"
          done
          cp README* LICENSE* "${staging}/" 2>/dev/null || true

          cd dist
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            7z a "${name}.zip" "${name}"
            asset="dist/${name}.zip"
          else
            tar -czf "${name}.tar.gz" "${name}"
            asset="dist/${name}.tar.gz"
          fi
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"

      - name: Upload binaries to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "${{ steps.package.outputs.asset }}" --clobber

  cleanup:
    name: Remove binaries from older releases
    if: github.event_name == 'release'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete packaged binaries, keeping only the two most recent releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          asset_ids=$(gh api --paginate --slurp "repos/${REPO}/releases" | jq -r '
            add
            | map(select((.draft | not) and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))))
            | sort_by(.published_at) | reverse
            | .[2:][]
            | .assets[]
            | select(.name | test("^rad-tools-v.*\\.(zip|tar\\.gz)$"))
            | "\(.id) \(.name)"')

          if [[ -z "${asset_ids}" ]]; then
            echo "No old binaries to remove."
            exit 0
          fi

          while read -r id name; do
            echo "Deleting ${name}"
            gh api -X DELETE "repos/${REPO}/releases/assets/${id}"
          done <<< "${asset_ids}"